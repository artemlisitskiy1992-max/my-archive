<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Индекс архива</title>
<style>
  :root { --bg: #f5f5f5; --panel: #fff; --border: #e0e0e0; --accent: #0066cc; --text: #333; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); }
  .container { max-width: 1100px; margin: 0 auto; background: var(--panel); border-radius: 12px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 24px; color: #111; display: flex; align-items: center; gap: 10px; }
  .btn-refresh { padding: 10px 16px; background: #0066cc; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px; transition: background 0.2s; }
  .btn-refresh:hover { background: #005bb5; }
  .btn-refresh:disabled { background: #ccc; cursor: not-allowed; }
  
  .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 24px; }
  .stat-card { background: #f8f9fa; border: 1px solid var(--border); border-radius: 8px; padding: 15px; text-align: center; }
  .stat-value { font-size: 24px; font-weight: bold; color: var(--accent); }
  .stat-label { font-size: 13px; color: #666; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.5px; }

  .search-wrapper { position: relative; margin-bottom: 20px; }
  #searchInput { width: 100%; padding: 14px 20px; border: 2px solid var(--border); border-radius: 10px; font-size: 16px; font-family: inherit; transition: all 0.2s; }
  #searchInput:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,102,204,0.15); }
  #searchReport { display: none; padding: 12px 15px; background: #eef6ff; border: 1px solid #cce0ff; border-radius: 8px; margin-bottom: 20px; font-size: 14px; color: #004488; }
  #searchReport strong { font-weight: 600; }
  #loader { text-align: center; padding: 40px; font-size: 18px; color: #666; display: none; }

  .tree { border-top: 1px solid var(--border); padding-top: 20px; }
  details { margin-bottom: 5px; }
  summary { padding: 8px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; font-weight: 500; transition: background 0.15s; user-select: none; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: '▶'; font-size: 10px; color: #888; margin-right: 10px; transition: transform 0.2s; display: inline-block; }
  details[open] > summary::before { transform: rotate(90deg); }
  summary:hover { background: #f0f0f0; }
  .folder .badge { margin-left: auto; font-size: 12px; color: #888; background: #eaeaea; padding: 2px 8px; border-radius: 12px; font-weight: normal; }
  .children { margin-left: 20px; padding-left: 10px; border-left: 1px solid var(--border); margin-top: 5px; }
  
  .file { display: flex; align-items: center; padding: 8px 12px; border-radius: 6px; font-size: 14px; transition: background 0.15s; }
  .file:hover { background: #f9f9f9; }
  .file a { color: #222; text-decoration: none; flex: 1; margin-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file a:hover { color: var(--accent); text-decoration: underline; }
  .icon { font-size: 18px; width: 24px; text-align: center; margin-right: 8px; }
  .file .size { font-size: 12px; color: #999; margin-left: 10px; white-space: nowrap; }
  .hidden { display: none !important; }
  .highlight { background-color: #fff3cd; padding: 0 2px; border-radius: 2px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📦 Индекс архива</h1>
    <button id="btnRefresh" class="btn-refresh">🔄 Обновить данные</button>
  </div>
  
  <div class="dashboard" id="dashboard"></div>

  <div class="search-wrapper">
    <input id="searchInput" type="text" placeholder="Поиск по названию папки, файла или пути...">
    <div id="searchReport"></div>
  </div>
  <div id="loader">⏳ Загрузка свежих данных из облака...</div>
  <div class="tree" id="treeContainer"></div>
</div>

  const token = "FD5NjEGdfmmqqPY";
  const base = "https://cloud.artek.org";
  
  const dashboard = document.getElementById('dashboard');
  const treeContainer = document.getElementById('treeContainer');
  const searchInput = document.getElementById('searchInput');
  const searchReport = document.getElementById('searchReport');
  const btnRefresh = document.getElementById('btnRefresh');
  const loader = document.getElementById('loader');
  let searchTimeout;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = n => n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(1) + ' KB' : n < 1073741824 ? (n/1048576).toFixed(1) + ' MB' : (n/1073741824).toFixed(2) + ' GB';

  function buildTreeAndRender(items) {
    // Строим дерево
    const tree = { name: 'Корень', isDir: true, children: {}, files: [], size: 0 };
    items.forEach(item => {
      const parts = item.path.split('/');
      let current = tree;
      for (let i = 0; i < parts.length - 1; i++) {
        const part = parts[i];
        if (!current.children[part]) current.children[part] = { name: part, isDir: true, children: {}, files: [], size: 0 };
        current = current.children[part];
      }
      if (item.isDir) {
         if (!current.children[item.name]) current.children[item.name] = { name: item.name, isDir: true, children: {}, files: [], size: 0 };
      } else {
         current.files.push(item);
      }
    });

    // Считаем статистику
    function calcStats(node) {
      let totalSize = 0, totalFiles = 0, totalDirs = 0;
      node.files.forEach(f => { totalSize += f.size; totalFiles++; });
      Object.values(node.children).forEach(child => {
        const stats = calcStats(child);
        totalSize += stats.size; totalFiles += stats.files; totalDirs += stats.dirs + 1;
      });
      node.totalSize = totalSize; node.totalFiles = totalFiles; node.totalDirs = totalDirs;
      return { size: totalSize, files: totalFiles, dirs: totalDirs };
    }
    const globalStats = calcStats(tree);

    // Отрисовка
    dashboard.innerHTML = `
      <div class="stat-card"><div class="stat-value">${globalStats.files}</div><div class="stat-label">Файлов</div></div>
      <div class="stat-card"><div class="stat-value">${globalStats.dirs}</div><div class="stat-label">Папок</div></div>
      <div class="stat-card"><div class="stat-value">${fmt(globalStats.size)}</div><div class="stat-label">Общий размер</div></div>
    `;

    function renderNode(node) {
      let html = '';
      const sortedDirs = Object.values(node.children).sort((a,b) => a.name.localeCompare(b.name));
      const sortedFiles = node.files.sort((a,b) => a.name.localeCompare(b.name));

      sortedDirs.forEach(dir => {
        html += `<details class="folder" data-path="${esc(dir.name.toLowerCase())}">
          <summary><span class="icon">📁</span><span class="name">${esc(dir.name)}</span>
          <span class="badge">${dir.totalFiles} файлов, ${fmt(dir.totalSize)}</span></summary>
          <div class="children">${renderNode(dir)}</div></details>`;
      });

      sortedFiles.forEach(file => {
        const ext = file.name.split('.').pop().toLowerCase();
        let icon = '📄';
        if (['png','jpg','jpeg','gif','webp','svg'].includes(ext)) icon = '🖼️';
        else if (['pdf'].includes(ext)) icon = '📕';
        else if (['doc','docx','odt','rtf'].includes(ext)) icon = '📘';
        else if (['xls','xlsx','csv'].includes(ext)) icon = '📗';
        else if (['zip','rar','7z'].includes(ext)) icon = '🗜️';

        const fu = base + '/public.php/dav/files/' + token + '/' + file.path.split('/').map(encodeURIComponent).join('/');
        html += `<div class="file" data-search="${esc(file.name.toLowerCase())} ${esc(file.path.toLowerCase())}">
          <span class="icon">${icon}</span><a href="${fu}" target="_blank" rel="noopener">${esc(file.name)}</a>
          <span class="size">${fmt(file.size)}</span></div>`;
      });
      return html;
    }

    treeContainer.innerHTML = renderNode(tree);
  }

  // Инициализация
  buildTreeAndRender(initialData);

  // Оптимизированный поиск с Debounce (задержкой)
  searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    // Ждем 250 мс после последнего нажатия, затем ищем
    searchTimeout = setTimeout(() => {
      const q = e.target.value.trim().toLowerCase();
      const allFolders = Array.from(treeContainer.querySelectorAll('details'));
      const allFiles = Array.from(treeContainer.querySelectorAll('.file'));
      let foundFiles = 0, foundFolders = 0;

      if (!q) {
        searchReport.style.display = 'none';
        allFolders.forEach(f => { f.classList.remove('hidden'); f.open = false; });
        allFiles.forEach(f => {
          f.classList.remove('hidden');
          const a = f.querySelector('a');
          if (a.dataset.orig) a.innerHTML = a.dataset.orig;
        });
        return;
      }

      // Ищем файлы
      allFiles.forEach(file => {
        const data = file.dataset.search;
        const isMatch = data.includes(q);
        if (isMatch) {
          file.classList.remove('hidden');
          foundFiles++;
          const a = file.querySelector('a');
          if (!a.dataset.orig) a.dataset.orig = a.textContent;
          const regex = new RegExp('(' + q.replace(/[.*+?^${}()|[]\\]/g, '\\$&') + ')', 'ig');
          a.innerHTML = a.dataset.orig.replace(regex, '<span class="highlight">$1</span>');
        } else {
          file.classList.add('hidden');
        }
      });

      // Ищем папки (снизу вверх)
      allFolders.forEach(f => f.classList.add('hidden'));
      allFolders.forEach(f => f.classList.remove('hidden')); // Временно для проверки

      for (let i = allFolders.length - 1; i >= 0; i--) {
        const folder = allFolders[i];
        const folderName = folder.dataset.path;
        const hasVisibleFiles = folder.querySelectorAll('.file:not(.hidden)').length > 0;
        const hasVisibleSubfolders = folder.querySelectorAll('details:not(.hidden)').length > 0;
        
        if (hasVisibleFiles || hasVisibleSubfolders || folderName.includes(q)) {
          folder.classList.remove('hidden');
          folder.open = true;
          if (folderName.includes(q)) foundFolders++;
        } else {
          folder.classList.add('hidden');
        }
      }

      searchReport.style.display = 'block';
      if (foundFiles > 0 || foundFolders > 0) {
        searchReport.innerHTML = `Найдено: <strong>${foundFiles} файлов</strong> и <strong>${foundFolders} папок</strong>.`;
      } else {
        searchReport.innerHTML = `Ничего не найдено.`;
      }
    }, 250); // Задержка 250 мс
  });

  // Кнопка обновления данных (Динамичность)
  btnRefresh.addEventListener('click', async () => {
    btnRefresh.disabled = true;
    loader.style.display = 'block';
    treeContainer.style.opacity = '0.3';
    
    try {
      // Используем CORS-прокси, чтобы файл работал даже локально
      const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(`${base}/public.php/dav/files/${token}/`);
      const r = await fetch(proxyUrl, {
        method: 'PROPFIND',
        headers: { 'Depth': 'infinity', 'Content-Type': 'application/xml', 'X-Requested-With': 'XMLHttpRequest' },
        body: '<?xml version="1.0"?><d:propfind xmlns:d="DAV:"><d:prop><d:displayname/><d:getcontentlength/><d:resourcetype/></d:prop></d:propfind>'
      });
      
      if (!r.ok) throw new Error('Ошибка сервера: ' + r.status);
      const xml = await r.text();
      const doc = new DOMParser().parseFromString(xml, 'application/xml');
      const prefix = `/public.php/dav/files/${token}/`;
      const newItems = [];
      
      for (const resp of doc.getElementsByTagNameNS('DAV:', 'response')) {
        const href = resp.getElementsByTagNameNS('DAV:', 'href')[0]?.textContent;
        if (!href) continue;
        const p = decodeURIComponent(href);
        if (!p.startsWith(prefix)) continue;
        const relPath = p.slice(prefix.length).replace(/\/+$/, '');
        if (!relPath) continue;
        const prop = resp.getElementsByTagNameNS('DAV:', 'prop')[0];
        if (!prop) continue;
        const rt = prop.getElementsByTagNameNS('DAV:', 'resourcetype')[0];
        const isDir = rt && rt.getElementsByTagNameNS('DAV:', 'collection').length > 0;
        const sz = prop.getElementsByTagNameNS('DAV:', 'getcontentlength')[0];
        newItems.push({ path: relPath, name: relPath.split('/').pop(), isDir, size: sz ? +sz.textContent : 0 });
      }
      
      buildTreeAndRender(newItems);
      searchInput.value = '';
      searchReport.style.display = 'none';
      alert('Данные успешно обновлены!');
    } catch (err) {
      alert('Не удалось обновить данные. Возможно, публичная ссылка закрыта или CORS-прокси перегружен.\nОшибка: ' + err.message);
    } finally {
      btnRefresh.disabled = false;
      loader.style.display = 'none';
      treeContainer.style.opacity = '1';
    }
  });
</script>
